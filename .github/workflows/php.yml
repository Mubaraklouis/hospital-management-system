name: Hospital CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Builds the image to check that it still builds. Nothing is pushed:
    # the image is not published to any public registry.
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        push: false
        tags: hospitalsystem:ci
        build-args: |
          WWWGROUP=1000
          WWWUSER=1000
